<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenSwap — обмен растениями</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="wordmark" href="#">GreenSwap</a>
      <p>Обмен растениями и семенами</p>
      <a class="catalog-link" href="#catalog-title">Смотреть каталог ↓</a>
    </header>

    <section class="hero" aria-label="GreenSwap — обмен растениями рядом">
      <p class="hero-note">[ растения меняются хозяевами ]</p>
      <h1>greenswap</h1>
      <figure class="hero-media">
        <img
          src="https://images.unsplash.com/photo-1604512232589-b7640441ed1f?auto=format&amp;fit=crop&amp;q=86&amp;w=1800"
          alt="Крупный зелёный лист монстеры на светлом фоне"
        >
      </figure>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <h2 id="catalog-title">Каталог предложений</h2>
          <p>Растения и семена, которыми готовы поделиться рядом с вами.</p>
        </div>

        <div class="filter-control">
          <label for="type-filter">Тип растения</label>
          <select id="type-filter">
            <option value="all">Все предложения</option>
            <option value="indoor">Комнатные растения</option>
            <option value="seeds">Семена</option>
          </select>
        </div>
      </div>

      <div id="plant-list" class="cards" aria-live="polite"></div>
      <p class="offer-count">Сейчас доступно: 3 предложения</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
