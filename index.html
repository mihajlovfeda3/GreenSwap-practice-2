<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenSwap — обмен растениями</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand">
        <h1>GreenSwap</h1>
        <p>Обмен растениями и семенами рядом с вами</p>
      </div>
      <span class="offer-count">Сейчас доступно: 3 предложения</span>
    </header>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <h2 id="catalog-title">Каталог предложений</h2>
          <p>Выберите категорию, чтобы быстрее найти подходящий вариант.</p>
        </div>

        <div class="filter-control">
          <label for="type-filter">Тип растения</label>
          <select id="type-filter">
            <option value="all">Все предложения</option>
            <option value="indoor">Комнатные растения</option>
            <option value="seeds">Семена</option>
          </select>
        </div>
      </div>

      <div id="plant-list" class="cards" aria-live="polite"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
